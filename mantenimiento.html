<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGA - Mantenimiento y Reportes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @media print {
            body {
                font-size: 9px !important;
                background: white !important;
                color: black !important;
            }
            header, .no-print, button {
                display: none !important;
            }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

    <!-- HEADER -->
    <header class="bg-gray-900 text-white p-4 shadow-md flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">⚙️</span>
            <h1 class="text-xl font-bold">SIGA - Mantenimiento y Reportes</h1>
        </div>
        <div class="flex items-center space-x-4">
            <a href="agenda.html" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center space-x-1">
                <span>📅</span> <span>Ir a Agenda</span>
            </a>
            <span id="user-email" class="text-sm text-gray-300"></span>
            <button onclick="cerrarSesion()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg text-sm font-semibold transition">
                Salir
            </button>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="max-w-7xl mx-auto p-6">
        
        <!-- CONTROLES SUPERIORES -->
        <div class="bg-white p-4 rounded-xl shadow-sm mb-6 flex flex-wrap gap-4 justify-between items-center no-print">
            
            <div class="flex flex-wrap items-center gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Seleccionar Módulo:</label>
                    <select id="select-tabla" onchange="cambiarModulo()" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                        <option value="servicios">Servicios</option>
                        <option value="clientes">Clientes</option>
                        <option value="personal">Personal / Trabajadoras</option>
                        <option value="horarios">Horarios</option>
                        <option value="instrucciones">Instrucciones</option>
                    </select>
                </div>

                <!-- BUSCADOR ÁGIL EN TIEMPO REAL -->
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Búsqueda General:</label>
                    <div class="relative">
                        <input type="text" id="input-busqueda" onkeyup="filtrarTabla()" placeholder="Buscar por ID, Nombre, Teléfono..." class="border border-gray-300 rounded-lg pl-9 pr-4 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none w-72 bg-white">
                        <span class="absolute left-3 top-2.5 text-gray-400 text-sm">🔍</span>
                    </div>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <button onclick="exportarCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center space-x-1">
                    <span>📊</span> <span>Exportar Excel (CSV)</span>
                </button>
                <button onclick="window.print()" class="bg-gray-700 hover:bg-gray-800 text-white px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center space-x-1">
                    <span>🖨️</span> <span>Imprimir / Reporte</span>
                </button>
                <button onclick="abrirModalNuevo()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center space-x-1">
                    <span>➕</span> <span>Nuevo Registro</span>
                </button>
            </div>
        </div>

        <!-- TABLA DE DATOS -->
        <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-200">
            <div id="loading" class="text-center py-10 text-gray-500">Cargando registros...</div>
            <div class="overflow-x-auto">
                <table id="tabla-datos" class="w-full text-left border-collapse hidden">
                    <thead id="tabla-head" class="bg-gray-50 text-gray-600 text-xs uppercase font-semibold border-b border-gray-200">
                    </thead>
                    <tbody id="tabla-body" class="divide-y divide-gray-200 text-sm">
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- MODAL DE CREACIÓN / EDICIÓN -->
    <div id="modal-registro" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 m-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 id="modal-titulo" class="text-lg font-bold text-gray-800">Nuevo Registro</h3>
                <button onclick="cerrarModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
            </div>
            <form id="form-registro" onsubmit="guardarRegistro(event)">
                <div id="modal-inputs" class="space-y-4"></div>
                <div class="mt-6 flex justify-end space-x-3">
                    <button type="button" onclick="cerrarModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2 rounded-lg text-sm font-semibold transition">Cancelar</button>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPT DE SUPABASE Y LÓGICA -->
    <script>
        // PEGA AQUÍ TUS CREDENCIALES REALES DE SUPABASE:
        const SUPABASE_URL = 'https://sdrbgwhivwxrmuytrcog.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_x8cddmEhtemL0drwyNd0sw_VqzX7mMy';
        
        let supabaseClient = null;
        try {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch(e) {
            console.error("Error iniciando Supabase", e);
        }

        let tablaActual = 'servicios';
        let datosOriginales = [];
        let camposTabla = [];
        let pkColumna = 'id_servicio';
        let ordenColumnaActual = '';
        let ordenAscendente = true;

        // Configuración de llaves primarias y campos por defecto para ordenamiento
        const configTablas = {
        servicios: { pk: 'id_servicio', ordenDefecto: 'nombre_servicio' },
        clientes: { pk: 'id_cliente', ordenDefecto: 'nombre' },
        personal: { pk: 'id_profesional', ordenDefecto: 'nombre' },
        horarios: { pk: 'id', ordenDefecto: 'dia' }, // Cambiar 'id_horario' por 'id' si en Supabase se llama 'id'
        instrucciones: { pk: 'id', ordenDefecto: 'titulo' }
        };

        async function verificarSesion() {
            if(!supabaseClient) return;
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
            } else {
                document.getElementById('user-email').textContent = session.user.email;
                cambiarModulo();
            }
        }

        function cerrarSesion() {
            if(supabaseClient) supabaseClient.auth.signOut();
            window.location.href = 'login.html';
        }

        function cambiarModulo() {
            tablaActual = document.getElementById('select-tabla').value;
            pkColumna = configTablas[tablaActual].pk;
            ordenColumnaActual = configTablas[tablaActual].ordenDefecto;
            ordenAscendente = true;
            document.getElementById('input-busqueda').value = '';
            cargarDatos();
        }

        async function cargarDatos() {
            if(!supabaseClient) return;
            document.getElementById('loading').style.display = 'block';
            document.getElementById('tabla-datos').classList.add('hidden');

            if(!ordenColumnaActual) {
                ordenColumnaActual = configTablas[tablaActual].ordenDefecto;
            }

            let { data, error } = await supabaseClient
                .from(tablaActual)
                .select('*')
                .order(ordenColumnaActual, { ascending: ordenAscendente });

            document.getElementById('loading').style.display = 'none';

            if (error) {
                alert('Error al cargar datos: ' + error.message);
                return;
            }

            datosOriginales = data || [];
            renderizarTabla(datosOriginales);
        }

        function ordenarPorColumna(campo) {
            if (ordenColumnaActual === campo) {
                ordenAscendente = !ordenAscendente;
            } else {
                ordenColumnaActual = campo;
                ordenAscendente = true;
            }
            cargarDatos();
        }

        function renderizarTabla(datos) {
            const tabla = document.getElementById('tabla-datos');
            const thead = document.getElementById('tabla-head');
            const tbody = document.getElementById('tabla-body');

            thead.innerHTML = '';
            tbody.innerHTML = '';

            if (datos.length === 0) {
                tbody.innerHTML = `<tr><td colspan="100" class="text-center py-6 text-gray-500">No se encontraron registros.</td></tr>`;
                tabla.classList.remove('hidden');
                return;
            }

            camposTabla = Object.keys(datos[0]);

            // Crear Encabezado interactivo para ordenar por clic
            let headTr = document.createElement('tr');
            camposTabla.forEach(campo => {
                let th = document.createElement('th');
                th.className = "px-6 py-3 font-semibold text-gray-700 cursor-pointer hover:bg-gray-100 transition select-none";
                let indicador = ordenColumnaActual === campo ? (ordenAscendente ? ' 🔼' : ' 🔽') : '';
                th.innerHTML = `${campo.toUpperCase()}${indicador}`;
                th.onclick = () => ordenarPorColumna(campo);
                headTr.appendChild(th);
            });
            let thAccions = document.createElement('th');
            thAccions.className = "px-6 py-3 font-semibold text-gray-700 text-right";
            thAccions.textContent = "ACCIONES";
            headTr.appendChild(thAccions);
            thead.appendChild(headTr);

            // Crear Filas
            datos.forEach(row => {
                let tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition border-b border-gray-100";

                camposTabla.forEach(campo => {
                    let td = document.createElement('td');
                    td.className = "px-6 py-4 text-gray-700";
                    let val = row[campo];
                    if (typeof val === 'boolean') {
                        td.innerHTML = val ? '<span class="text-green-600 font-bold">Sí</span>' : '<span class="text-red-600 font-bold">No</span>';
                    } else {
                        td.textContent = val !== null ? val : '';
                    }
                    tr.appendChild(td);
                });

                let tdAcc = document.createElement('td');
                tdAcc.className = "px-6 py-4 text-right space-x-2";
                let pkVal = row[pkColumna];

                tdAcc.innerHTML = `
                    <button onclick='abrirModalEditar(${JSON.stringify(row)})' class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-1 rounded text-xs font-semibold transition">Editar</button>
                    <button onclick='borrarRegistro("${pkVal}")' class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-xs font-semibold transition">Borrar</button>
                `;
                tr.appendChild(tdAcc);
                tbody.appendChild(tr);
            });

            tabla.classList.remove('hidden');
        }

        // Búsqueda instantánea en tiempo real
        function filtrarTabla() {
            const texto = document.getElementById('input-busqueda').value.toLowerCase();
            const filtrados = datosOriginales.filter(row => {
                return Object.values(row).some(val => val !== null && String(val).toLowerCase().includes(texto));
            });
            renderizarTabla(filtrados);
        }

        function abrirModalNuevo() {
            document.getElementById('modal-titulo').textContent = "Nuevo Registro";
            const contenedor = document.getElementById('modal-inputs');
            contenedor.innerHTML = '';
            document.getElementById('form-registro').reset();

            let sample = datosOriginales[0] || {};
            Object.keys(sample).forEach(campo => {
                if (campo === pkColumna) return; // Asumimos PK autoincremental/generada
                contenedor.innerHTML += `
                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">${campo}</label>
                        <input type="text" name="${campo}" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                `;
            });
            document.getElementById('modal-registro').classList.remove('hidden');
        }

        function abrirModalEditar(row) {
            document.getElementById('modal-titulo').textContent = "Editar Registro";
            const contenedor = document.getElementById('modal-inputs');
            contenedor.innerHTML = '';

            Object.keys(row).forEach(campo => {
                let val = row[campo] !== null ? row[campo] : '';
                let readonly = (campo === pkColumna) ? 'readonly class="w-full border border-gray-200 bg-gray-100 rounded-lg px-3 py-2 text-sm outline-none text-gray-500"' : 'class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none"';
                contenedor.innerHTML += `
                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">${campo}</label>
                        <input type="text" name="${campo}" value="${val}" ${readonly}>
                    </div>
                `;
            });
            document.getElementById('modal-registro').classList.remove('hidden');
        }

        function cerrarModal() {
            document.getElementById('modal-registro').classList.add('hidden');
        }

        async function guardarRegistro(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const datosObj = {};
            formData.forEach((val, key) => { datosObj[key] = val !== "" ? val : null; });

            let pkVal = datosObj[pkColumna];
            let query;
            let existe = datosOriginales.some(r => String(r[pkColumna]) === String(pkVal));

            if (existe && pkVal) {
                query = await supabaseClient.from(tablaActual).update(datosObj).eq(pkColumna, pkVal);
            } else {
                delete datosObj[pkColumna];
                query = await supabaseClient.from(tablaActual).insert([datosObj]);
            }

            if (query.error) {
                alert('Error al guardar: ' + query.error.message);
            } else {
                cerrarModal();
                cargarDatos();
            }
        }

        async function borrarRegistro(pkVal) {
            if (!confirm('¿Estás seguro de eliminar este registro?')) return;

            const { error } = await supabaseClient.from(tablaActual).delete().eq(pkColumna, pkVal);
            if (error) {
                alert('Error al eliminar: ' + error.message);
            } else {
                cargarDatos();
            }
        }

        function exportarCSV() {
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += camposTabla.join(",") + "\r\n";
            datosOriginales.forEach(row => {
                let fila = camposTabla.map(campo => {
                    let val = row[campo] !== null && row[campo] !== undefined ? String(row[campo]) : '';
                    return `"${val.replace(/"/g, '""')}"`;
                });
                csvContent += fila.join(",") + "\r\n";
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `reporte_${tablaActual}_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Inicializar sesión y cargar la primera tabla
        verificarSesion();
    </script>
</body>
</html>
