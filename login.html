<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestión - Iniciar Sesión</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 font-sans min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 border border-slate-200">
    <div class="text-center mb-8">
      <div class="bg-blue-100 text-blue-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
        🔐
      </div>
      <h2 class="text-2xl font-bold text-slate-800">Acceso al Sistema SIGA</h2>
      <p class="text-slate-500 text-sm mt-1">Ingresa tus credenciales para acceder a la agenda</p>
    </div>

    <div id="alertMessage" class="hidden p-3 rounded-lg text-sm mb-4"></div>

    <form id="loginForm" onsubmit="iniciarSesion(event)" class="space-y-5">
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Correo Electrónico</label>
        <input type="email" id="email" required placeholder="usuario@tuempresa.com" class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800">
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Contraseña</label>
        <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800">
      </div>

      <button type="submit" id="btnSubmit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2">
        <span>Ingresar</span>
      </button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = "https://sdrbgwhivwxrmuytrcog.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkcmJnd2hpdnd4cm11eXRyY29nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1NTUyNzcsImV4cCI6MjEwNzEzMTI3N30.vsFieR-6tyMgx_fpZhO7RSjA3Z3BzJzR91Xp4rDnObU";
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function verificarSesionExistente() {
      const { data: { session } } = await _supabase.auth.getSession();
      if (session) {
        window.location.href = "agenda.html";
      }
    }
    verificarSesionExistente();

    async function iniciarSesion(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const alert = document.getElementById('alertMessage');
      const btn = document.getElementById('btnSubmit');

      btn.disabled = true;
      btn.innerText = "Verificando...";
      alert.classList.add('hidden');

      try {
        const { data, error } = await _supabase.auth.signInWithPassword({ email, password });

        if (error) {
          alert.className = "p-3 rounded-lg text-sm mb-4 bg-red-100 text-red-700 border border-red-200 block";
          alert.innerText = "Error: " + (error.message === "Invalid login credentials" ? "Correo o contraseña incorrectos" : error.message);
          btn.disabled = false;
          btn.innerText = "Ingresar";
        } else {
          alert.className = "p-3 rounded-lg text-sm mb-4 bg-emerald-100 text-emerald-700 border border-emerald-200 block";
          alert.innerText = "¡Acceso correcto! Redirigiendo...";
          setTimeout(() => {
            window.location.href = "agenda.html";
          }, 800);
        }
      } catch (err) {
        alert.className = "p-3 rounded-lg text-sm mb-4 bg-red-100 text-red-700 border border-red-200 block";
        alert.innerText = "Error de conexión: " + err.message;
        btn.disabled = false;
        btn.innerText = "Ingresar";
      }
    }
  </script>
</body>
</html>
